[project]
name = "eat-mo-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RSherstyuk", email = "rus.sherstyuk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[project.scripts]
eat-mo-bot = "eat_mo_bot:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
